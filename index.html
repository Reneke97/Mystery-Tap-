<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mystery Tap 🎁</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff7ed,#fdf2f8,#eff6ff);color:#1f2937}.card{width:min(560px,100%);background:rgba(255,255,255,.95);border-radius:28px;padding:34px 26px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.12)}.emoji{font-size:64px}h1{margin:14px 0 8px;font-size:36px}.sub{color:#6b7280;margin:0 auto 24px}.result{min-height:160px;display:grid;place-items:center;border:2px dashed #d1d5db;border-radius:20px;padding:24px;margin:22px 0;background:#fafafa}.result h2{margin:0 0 10px;font-size:25px}.result p{margin:0;font-size:18px;line-height:1.5}.small{margin-top:18px;color:#9ca3af;font-size:12px}.spin{animation:pop .45s ease}@keyframes pop{0%{transform:scale(.92);opacity:.2}100%{transform:scale(1);opacity:1}}
</style></head>

["😴 ENERGY CRISIS","Would you rather never need sleep or never need to eat?"],
["🎬 MOVIE NIGHT","What movie could you watch 100 times without getting tired of it?"],

let last=-1;

function reveal(){
  let i;
  do{
    i=Math.floor(Math.random()*surprises.length)
  }while(surprises.length>1&&i===last);

  last=i;

  const[t,p]=surprises[i],
  r=document.getElementById('result');

  r.classList.remove('spin');
  void r.offsetWidth;
  r.classList.add('spin');

  r.innerHTML=`<div><h2>${t}</h2><p>${p}</p></div>`;
}

window.addEventListener('load',()=>{
  setTimeout(reveal,500);
});
</script></body></html>
