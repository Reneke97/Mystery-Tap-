<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mystery Tap 🎁</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff7ed,#fdf2f8,#eff6ff);color:#1f2937}.card{width:min(560px,100%);background:rgba(255,255,255,.95);border-radius:28px;padding:34px 26px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.12)}.emoji{font-size:64px}h1{margin:14px 0 8px;font-size:36px}.sub{color:#6b7280;margin:0 auto 24px}.result{min-height:160px;display:grid;place-items:center;border:2px dashed #d1d5db;border-radius:20px;padding:24px;margin:22px 0;background:#fafafa}.result h2{margin:0 0 10px;font-size:25px}.result p{margin:0;font-size:18px;line-height:1.5}.small{margin-top:18px;color:#9ca3af;font-size:12px}.spin{animation:pop .45s ease}@keyframes pop{0%{transform:scale(.92);opacity:.2}100%{transform:scale(1);opacity:1}}
</style></head>
<body><main class="card"><div class="emoji">🎁</div><h1>Mystery Tap</h1><p class="sub">You found the secret NFC tag. Let's see what you've unlocked...</p><section id="result" class="result"><div><h2>🎲 Choosing your surprise...</h2><p>Just a moment...</p></div></section><div class="small">30 possible surprises • randomly selected</div></main>
<script>
const surprises=[
["🍫 YOU WON A CHOCOLATE!","Go see Reneke to claim your prize. 😄"],
["☕ COFFEE BREAK!","You've earned a little coffee break. Enjoy it guilt-free."],
["🍬 SWEET SUCCESS!","You won a sweet. Because apparently that's how we measure success around here."],
["❤️ SOMEONE APPRECIATES YOU","Your hard work hasn't gone unnoticed. Keep being awesome."],
["😂 YOU'VE BEEN SELECTED","For absolutely no reason whatsoever. Congratulations!"],
["⭐ TEAM MVP MOMENT","Someone on this team thinks you make the workplace better."],
["🎵 YOU'RE THE DJ","You get to choose the team's background music for the next 30 minutes."],
["🏆 EMPLOYEE OF THE MOMENT","Your official title for the next 30 minutes: Employee of the Moment."],
["😈 CHAOS UNLOCKED","Your productivity has been temporarily revoked. Please recover responsibly."],
["👏 GENUINE COMPLIMENT","You are doing better than you probably give yourself credit for."],
["🧁 SNACK ATTACK","You have unlocked permission to acquire a snack. Use this power wisely."],
["🌟 LITTLE WIN","Whatever you accomplished today — even the tiny things count. Well done."],
["🤣 BAD NEWS","You've been nominated for 'Most Likely to Say I'll Do It Now'."],
["🎯 MINI CHALLENGE","Make one person laugh today. No explanation required."],
["💛 KINDNESS BONUS","Give someone a genuine compliment before the day ends."],
["🕵️ TOP SECRET","You have discovered something management doesn't know exists. Keep tapping. 😂"],
["🥳 CONGRATULATIONS!","You have successfully completed today's extremely important task: tapping a sticker."],
["🧠 RANDOM FACT","Octopuses have three hearts. Your finance team probably has fewer after month-end."],
["🐝 RANDOM FACT","Bees can recognise human faces. So behave yourself around the office bees. 😄"],
["😎 COOL PERSON ALERT","This phone has detected a suspiciously cool employee."],
["📈 PRODUCTIVITY BONUS","Your productivity has increased by approximately 0.0001%. You're welcome."],
["🍪 COOKIE ENERGY","You didn't win a cookie. But now you really want one, don't you?"],
["💌 SECRET MESSAGE","Someone is glad you're part of the team. That's it. That's the surprise. ❤️"],
["🎲 RISKY BUSINESS","You tapped an unknown sticker. That's either brave or questionable. We respect it."],
["🙌 HIGH FIVE!","Imagine receiving a very enthusiastic high five right now. ✋"],
["🌈 GOOD VIBES ONLY","Take a breath. You've got this. One thing at a time."],
["💰 FINANCE EDITION","Your accounts are balanced. Your life is balanced. Everything is balanced. Probably."],
["🚨 IMPORTANT ANNOUNCEMENT","This is your official reminder that you're allowed to have fun at work."],
["🥇 GOLD STAR","⭐ You get a completely unofficial gold star for being you."],
["🎁 MYSTERY BONUS","Your surprise is... another surprise. Ask Reneke what you've won. 😈"]
];

let last=-1;

function reveal(){
  let i;
  do{
    i=Math.floor(Math.random()*surprises.length)
  }while(surprises.length>1&&i===last);

  last=i;

  const[t,p]=surprises[i],
  r=document.getElementById('result');

  r.classList.remove('spin');
  void r.offsetWidth;
  r.classList.add('spin');

  r.innerHTML=`<div><h2>${t}</h2><p>${p}</p></div>`;
}

window.addEventListener('load',()=>{
  setTimeout(reveal,500);
});
</script></body></html>
